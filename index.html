<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070a11" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="A股大亨" />
<title>A股大亨 · 真实行情虚拟炒股</title>
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">📈</div>
      <div>
        <h1>A股大亨</h1>
        <p>真实行情 · 虚拟资金</p>
      </div>
    </div>

    <div class="headline">
      <span class="label">总资产</span>
      <strong id="totalAsset">--</strong>
      <span id="totalProfit" class="chip">--</span>
    </div>

    <div class="metrics">
      <div class="metric"><span>今日盈亏</span><b id="dayPnl">--</b></div>
      <div class="metric"><span>持仓市值</span><b id="marketValue">--</b></div>
      <div class="metric"><span>可用现金</span><b id="cash">--</b></div>
      <div class="metric"><span>段位</span><b id="rank">--</b></div>
    </div>

    <div class="season">
      <div class="season-top">
        <span>赛季目标 ¥150万</span>
        <b id="seasonDays">第 0 个交易日</b>
      </div>
      <div class="bar"><i id="seasonBar"></i></div>
      <div class="season-bottom"><span id="seasonPct">0%</span><span id="clock">--:--:--</span></div>
    </div>
  </header>

  <main class="layout">

    <!-- 左：自选股 -->
    <section class="panel watch">
      <div class="panel-head">
        <h2>自选股</h2>
        <button class="icon-btn" id="refreshBtn" title="刷新行情">⟳</button>
      </div>
      <div class="search">
        <input id="searchInput" type="text" placeholder="代码 / 名称，如 600519、茅台" autocomplete="off" />
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div class="index-row" id="indices"></div>
      <div class="watch-list" id="watchList"></div>
    </section>

    <!-- 中：个股 + 交易 -->
    <section class="mid">
      <div class="panel stock">
        <div class="stock-head">
          <div class="stock-title">
            <h2 id="stockName">--</h2>
            <span id="stockCode" class="code">--</span>
            <button class="icon-btn" id="starBtn" title="加入/移出自选">☆</button>
          </div>
          <div class="stock-price">
            <strong id="stockPrice">--</strong>
            <span id="stockChange" class="chip">--</span>
          </div>
        </div>
        <div class="chart-meta">
          <span>分时</span>
          <span id="chartRange" class="dim">--</span>
          <span id="quoteTime" class="dim"></span>
        </div>
        <div class="chart-wrap">
          <canvas id="minuteChart"></canvas>
          <div id="chartEmpty" class="chart-empty">选择左侧股票查看分时</div>
        </div>
      </div>

      <div class="panel trade">
        <div class="side-tabs">
          <button data-side="buy" class="active">买入</button>
          <button data-side="sell">卖出</button>
        </div>

        <div class="trade-body">
          <div class="trade-line">
            <span class="dim">成交价</span>
            <b id="tradePrice">市价 --</b>
            <span class="tag" id="tradeTag"></span>
          </div>

          <div class="qty-row">
            <span class="dim">数量</span>
            <div class="stepper">
              <button type="button" data-step="-100">−</button>
              <input id="qtyInput" type="number" value="100" min="100" step="100" />
              <button type="button" data-step="100">＋</button>
            </div>
            <span class="dim">股</span>
          </div>

          <div class="quick">
            <button data-ratio="0.25">1/4</button>
            <button data-ratio="0.5">1/2</button>
            <button data-ratio="0.75">3/4</button>
            <button data-ratio="max">全部</button>
          </div>

          <div class="calc">
            <div><span>预计金额</span><b id="calcAmount">¥0.00</b></div>
            <div><span>手续费</span><b id="calcFees">¥0.00</b></div>
            <div><span id="calcAvailLabel">可用现金</span><b id="calcAvail">¥0.00</b></div>
          </div>

          <button id="submitTrade" class="submit buy">买入</button>
          <p class="hint">T+1 · 100股/手 · 涨跌停限制 · 佣金万2.5（最低5元）</p>
        </div>
      </div>
    </section>

    <!-- 右：资产 + 持仓/成交/成就 -->
    <section class="right">
      <div class="panel equity">
        <div class="panel-head">
          <h2>资产曲线</h2>
          <span class="dim" id="equityRange">--</span>
        </div>
        <div class="chart-wrap small">
          <canvas id="equityChart"></canvas>
        </div>
        <div class="equity-foot">
          <span>初始 ¥100万</span>
          <span id="feedState" class="feed">连接中…</span>
        </div>
      </div>

      <div class="panel tabs-panel">
        <div class="tabs">
          <button data-tab="positions" class="active">持仓</button>
          <button data-tab="trades">成交</button>
          <button data-tab="achievements">成就</button>
        </div>
        <div class="tab-body" id="tabPositions"></div>
        <div class="tab-body hidden" id="tabTrades"></div>
        <div class="tab-body hidden" id="tabAchievements"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>行情来自腾讯证券（页面 5 秒刷新），仅供娱乐学习，不构成投资建议。</span>
    <button id="resetBtn" class="link-btn">重开一局</button>
  </footer>
</div>

<div class="mobile-bar" id="mobileBar">
  <div class="mb-total">
    <span>总资产</span>
    <b id="mbTotal">--</b>
  </div>
  <div class="mb-actions">
    <button class="mb-buy" data-mobile-side="buy">买入</button>
    <button class="mb-sell" data-mobile-side="sell">卖出</button>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-icon" id="modalIcon">📈</div>
    <h3 id="modalTitle">A股大亨</h3>
    <div id="modalText" class="modal-text"></div>
    <div class="modal-actions">
      <button class="ghost" id="modalCancel">取消</button>
      <button class="primary" id="modalOk">确定</button>
    </div>
  </div>
</div>

<script src="./engine.js"></script>
<script src="./app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
